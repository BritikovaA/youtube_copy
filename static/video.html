<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/video.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="/">YouTube Copy</a>

        <nav class="header-nav">
            <a href="/">Главная</a>
            <a id="upload-link" href="/upload.html" hidden>
                Загрузить видео
            </a>
        </nav>

        <div id="auth-actions" class="header-actions">
            <a class="button button-secondary" href="/auth.html?mode=login">
                Войти
            </a>
            <a class="button button-primary" href="/auth.html?mode=register">
                Регистрация
            </a>
        </div>
    </header>

    <main class="container">
        <section id="video-content" hidden>
            <div
                id="video-moderation-badge"
                class="video-moderation-badge video-moderation-notice"
                hidden
            >
                Видео нарушает правила платформы и скрыто от других пользователей.
            </div>

            <div
                id="video-reported-badge"
                class="video-reported-badge video-moderation-notice"
                hidden
            >
                Видео отправлено на проверку модератору.
            </div>

            <video
                id="video-player"
                class="video-player"
                controls
                preload="metadata"
            ></video>

            <h1 id="video-title"></h1>

            <div class="video-meta">
                <span id="video-views"></span>
                <span id="video-date"></span>
            </div>

            <div class="video-actions">
                <button
                    id="like-button"
                    class="button button-secondary"
                    type="button"
                >
                    Нравится
                </button>

                <span id="like-count" class="like-count">0 лайков</span>
                <span id="like-message" class="action-message" hidden></span>
            </div>

            <div class="video-actions">
                <button
                    id="report-button"
                    class="button button-report"
                    type="button"
                >
                    Пожаловаться
                </button>

                <span id="report-message" class="report-message" hidden></span>
            </div>

            <div class="channel-info">
                <div>
                    <a id="channel-link" href="#">
                        <strong id="channel-email"></strong>
                    </a>
                </div>

                <button
                    id="subscribe-button"
                    class="button button-primary"
                    type="button"
                    hidden
                >
                    Подписаться
                </button>
            </div>

            <div class="video-description">
                <p id="video-description"></p>
            </div>

            <section class="comments-section">
                <h2>
                    Комментарии
                    <span id="comments-count" class="comments-count">0</span>
                </h2>

                <div id="comments-auth-message" class="comments-auth-message" hidden>
                    <a href="/auth.html?mode=login">Войдите</a>,
                    чтобы оставить комментарий.
                </div>

                <form id="comment-form" class="comment-form" hidden>
                    <label for="comment-input">Ваш комментарий</label>

                    <textarea
                        id="comment-input"
                        name="text"
                        rows="3"
                        placeholder="Напишите комментарий..."
                        required
                    ></textarea>

                    <button
                        id="comment-submit"
                        class="button button-primary"
                        type="submit"
                    >
                        Отправить
                    </button>
                </form>

                <p id="comments-message" class="message" hidden></p>

                <div id="comments-list" class="comments-list"></div>
            </section>
        </section>

        <p id="video-page-message" class="message" hidden></p>
    </main>
</body>
</html>

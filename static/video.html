<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/video.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="/">YouTube Copy</a>

        <nav class="header-nav">
            <a href="/">Главная</a>
            <a id="upload-link" href="/upload.html" hidden>Загрузить видео</a>
        </nav>

        <div id="auth-actions" class="header-actions">
            <a class="button button-secondary" href="/auth.html?mode=login">
                Войти
            </a>
            <a class="button button-primary" href="/auth.html?mode=register">
                Регистрация
            </a>
        </div>
    </header>

    <main class="container">
        <section id="video-content" hidden>
            <video
                id="video-player"
                class="video-player"
                controls
                preload="metadata"
            ></video>

            <h1 id="video-title"></h1>

            <div class="video-meta">
                <span id="video-views"></span>
                <span id="video-date"></span>
            </div>

            <div class="video-actions">
                <button
                    id="like-button"
                    class="button button-secondary"
                    type="button"
                >
                    Нравится
                </button>

                <span id="like-count" class="like-count">0 лайков</span>
                <span id="like-message" class="action-message" hidden></span>
            </div>

            <div class="channel-info">
                <div>
                    <a id="channel-link" href="#">
                        <strong id="channel-email"></strong>
                    </a>
                </div>

                <button
                    id="subscribe-button"
                    class="button button-primary"
                    type="button"
                    hidden
                >
                    Подписаться
                </button>
            </div>

            <div class="video-description">
                <p id="video-description"></p>
            </div>
        </section>
    </main>
</body>
</html>

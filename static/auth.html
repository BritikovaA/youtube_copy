<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — YouTube Copy</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/auth.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/">YouTube Copy</a>
        <nav class="header-nav">
            <a href="/">Главная</a>
        </nav>
    </header>

    <main class="container auth-container">
        <section class="auth-card">
            <div class="auth-tabs">
                <button type="button" id="login-tab" class="auth-tab active">
                    Вход
                </button>
                <button type="button" id="register-tab" class="auth-tab">
                    Регистрация
                </button>
            </div>

            <form id="auth-form">
                <h1 id="auth-title">Вход в аккаунт</h1>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="auth-submit" class="button button-primary button-full">
                    Войти
                </button>

                <div id="auth-message" class="message" hidden></div>
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Copy</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/index.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="/">YouTube Copy</a>

        <nav class="header-nav">
            <a href="/">Главная</a>
            <a id="upload-link" href="/upload.html" hidden>Загрузить видео</a>
        </nav>

        <div id="auth-actions" class="header-actions">
            <a class="button button-secondary" href="/auth.html?mode=login">
                Войти
            </a>
            <a class="button button-primary" href="/auth.html?mode=register">
                Регистрация
            </a>
        </div>
    </header>

    <main class="container">
        <form id="search-form" class="search-form">
            <input
                id="search-input"
                type="search"
                placeholder="Поиск видео"
            >
            <button class="button button-primary" type="submit">
                Найти
            </button>
        </form>

        <p id="videos-message" class="message" hidden></p>

        <section>
            <h1>Видео</h1>
            <div id="videos-list" class="videos-grid"></div>
        </section>
    </main>
</body>
</html>
